# 本地设备版编排的第二种数据来源：应用用你自己的 PostgreSQL，设备上不起自带的库。
#
# 与 docker-compose.appliance.yml 的区别只有一处——**没有 postgres 服务**：
# 业务库是外部的（你自己的服务器 / 1Panel / 云数据库），设备只跑应用。
# 这样更新脚本 `docker compose config --services` 里没有数据库服务，会自动改用
# DATABASE_URL 走宿主机侧探针与备份，不会误连设备自带的库。
#
# 用法（设备上 /opt/fmkj/app）：
#   cp .env.production.example .env.production
#   # DATABASE_URL 指向外部库，例如：
#   #   postgresql://fmkj:口令@10.0.0.50:5432/fmkj
#   # 这时不需要 POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB 三个变量。
#   cp .env.appliance.example .env        # 只保留 FMKJ_IMAGE / FMKJ_VERSION / FMKJ_BIND
#   docker compose -f docker-compose.appliance-external-db.yml run --rm app node scripts/run-migration.mjs
#   docker compose -f docker-compose.appliance-external-db.yml up -d
#
# 注意：这种形态下备份/恢复依赖设备能直连那个库；备份脚本用 postgres:17-alpine 镜像
# 里的 pg_dump，设备上要有该镜像。数据库的运维（备份策略、扩容、高可用）由该库的使用者负责。
name: fmkj

# 容器名与数据卷名可以用环境变量改（默认与以前完全一致）。同一台机器上要再跑一套
# 做验证或演示时，改这几个变量就不会跟正式那套撞名；出货设备保持默认即可。
services:
  # 同 docker-compose.appliance.yml：数据卷归 root、应用以 1001 运行，不修正首次上传会失败。
  # 更新请求目录要属于应用用户（uid 1001），否则页面点「立即更新」会 EACCES（黑豹 X2 真机实测）。
  # 应用只写得了 requests/ 这一层；管家的状态与日志在上一层、由 root 拥有，应用读得到、改不了。
  deploy-state-init:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    command: ["sh", "-c", "mkdir -p /data/deploy-state/requests && chown -R 1001:1001 /data/deploy-state/requests"]
    volumes:
      - ./deploy-state:/data/deploy-state

  uploads-init:
    image: ${ALPINE_IMAGE:-alpine}
    container_name: ${FMKJ_APP_CONTAINER:-fmkj-v3}-uploads-init
    command: ["sh", "-c", "mkdir -p /data/uploads && chown -R 1001:1001 /data/uploads"]
    restart: "no"
    volumes:
      - fmkj-uploads:/data/uploads

  app:
    image: ${FMKJ_IMAGE:-fmkj-v3:latest}
    container_name: ${FMKJ_APP_CONTAINER:-fmkj-v3}
    restart: unless-stopped
    depends_on:
      uploads-init:
        condition: service_completed_successfully
      deploy-state-init:
        condition: service_completed_successfully
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      FMKJ_VERSION: ${FMKJ_VERSION:-unknown}
      FILE_STORAGE: ${FILE_STORAGE:-local}
      FMKJ_STORAGE_ROOT: /data/uploads
      # 同自带库编排：管理员页面从这里读上次更新/备份结果。
      # 应用要往这里写「更新请求」（只含版本号），由宿主机上的更新管家执行；
      # 所以这个目录是读写挂载。应用仍然拿不到 docker socket（ADR 0010）。
      FMKJ_DEPLOY_STATE_DIR: /data/deploy-state
      # 设备是客户自己买的机器：不开放陌生人自助注册（账号由管理员在后台添加）。
      # 内网穿透把它暴露到公网时，这一条尤其重要。
      FMKJ_ALLOW_SELF_SIGNUP: ${FMKJ_ALLOW_SELF_SIGNUP:-false}
      # 设备版没接短信服务：登录页不显示短信验证码入口，免得点了收不到码。
      FMKJ_ALLOW_SMS_LOGIN: ${FMKJ_ALLOW_SMS_LOGIN:-false}
    ports:
      - "${FMKJ_BIND:-0.0.0.0}:${FMKJ_PORT:-8890}:3000"
    volumes:
      - fmkj-uploads:/data/uploads
      - ./deploy-state:/data/deploy-state

volumes:
  fmkj-uploads:
    name: ${FMKJ_UPLOADS_VOLUME:-fmkj-v3-uploads}
