# 设备端 frpc 用同一个 auth.token。这个文件里的 token 当密码保管。
# proxyBindAddr 让 vhost 端口只监听本机：外面只能从 Caddy 的 443 进来。
bindAddr = "0.0.0.0"
bindPort = 17000
# vhost 只在本机给 Caddy 用，不对外开
proxyBindAddr = "127.0.0.1"
vhostHTTPPort = 18080
auth.method = "token"
auth.token = "请换成一串随机长字符串：openssl rand -base64 32"
transport.maxPoolCount = 50
log.to = "console"
log.level = "info"
log.maxDays = 7
