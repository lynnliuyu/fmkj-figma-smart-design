# 系统日志上限（systemd-journald）。
#
# 2026-11-22 实测 /var/log/journal 占 741 MB，是当时磁盘告急的第三大来源。
# journal 默认按分区的 10% 上限增长，40 GB 分区意味着它可以长到 4 GB。
#
# 安装（服务器上，一次性；在仓库根目录执行，整段可复制）：
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo cp deploy/journald-disk.conf /etc/systemd/journald.conf.d/fmkj-disk.conf
#   sudo systemctl restart systemd-journald
#   journalctl --disk-usage     # 应显示 <200M
#
# 注意：只限制「归档日志总量」，不改变日志级别，排查问题所需的近期日志不受影响。

[Journal]
# 磁盘上持久化日志的总上限
SystemMaxUse=200M
# 单个日志文件上限，避免一个大文件难以轮转
SystemMaxFileSize=50M
# 运行期（/run/log/journal）上限，重启后即失效
RuntimeMaxUse=50M
# 保留最近 2 周，双保险
MaxRetentionSec=2week
