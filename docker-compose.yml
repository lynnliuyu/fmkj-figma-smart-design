services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # 更新流程用 FMKJ_IMAGE 固定到明确版本（例如 registry.example.com/fmkj-v3:v0.3.0），
    # 不写死 latest，否则无法回滚也无法确认当前跑的是哪一版。
    image: ${FMKJ_IMAGE:-fmkj-v3:latest}
    container_name: fmkj-v3
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      FMKJ_VERSION: ${FMKJ_VERSION:-unknown}
      # 附件默认落本地数据卷（本地设备版不需要外部对象存储）。
      # 若要接 Vercel Blob，把 FILE_STORAGE 设为 blob 并配 BLOB_READ_WRITE_TOKEN。
      FILE_STORAGE: ${FILE_STORAGE:-local}
      FMKJ_STORAGE_ROOT: /data/uploads
    ports:
      - "3000:3000"
    # 本地文件存储适配层落地后，上传的附件落在这个数据卷里；
    # 备份必须同时覆盖数据库和这个卷（ADR 0010）。
    volumes:
      - fmkj-uploads:/data/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  fmkj-uploads:
    name: fmkj-v3-uploads
