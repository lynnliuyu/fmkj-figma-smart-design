<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>产品图筛选 · 繁梦空间</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --line: #e4e7ec;
    --ink: #101828;
    --ink-2: #475467;
    --ink-3: #98a2b3;
    --brand: #0f766e;
    --brand-soft: #ccfbf1;
    --warn: #b54708;
    --warn-soft: #fef0c7;
    --pick: #0f766e;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 30;
    background: rgba(255,255,255,.94); backdrop-filter: saturate(180%) blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .bar { display: flex; align-items: center; gap: 16px; padding: 12px 20px; flex-wrap: wrap; }
  .title { font-size: 15px; font-weight: 650; letter-spacing: .2px; }
  .title small { font-weight: 400; color: var(--ink-3); margin-left: 8px; }
  .stats { display: flex; gap: 14px; margin-left: auto; font-size: 12.5px; color: var(--ink-2); }
  .stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .tabs { display: flex; gap: 6px; padding: 0 20px 12px; flex-wrap: wrap; }
  .tab {
    border: 1px solid var(--line); background: #fff; color: var(--ink-2);
    padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 13px;
    transition: .15s; white-space: nowrap;
  }
  .tab:hover { border-color: #cfd4dc; color: var(--ink); }
  .tab.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .tab .n { opacity: .6; margin-left: 5px; font-variant-numeric: tabular-nums; }
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 0 20px 12px; }
  input[type=search], select {
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font: inherit;
    background: #fff; color: var(--ink); outline: none; min-width: 160px;
  }
  input[type=search]:focus, select:focus { border-color: #9ec5c1; box-shadow: 0 0 0 3px rgba(15,118,110,.1); }
  .ghost {
    border: 1px solid var(--line); background: #fff; color: var(--ink-2);
    border-radius: 8px; padding: 7px 12px; cursor: pointer; font: inherit;
  }
  .ghost:hover { background: #f9fafb; color: var(--ink); }

  main { padding: 18px 20px 96px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow); padding: 12px; display: flex; flex-direction: column; gap: 10px;
    transition: border-color .15s;
  }
  .card.sel { border-color: #5eead4; box-shadow: 0 0 0 2px var(--brand-soft); }
  .card.done { opacity: .72; }
  .head { display: flex; align-items: flex-start; gap: 8px; }
  .sku { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--ink-2); }
  .name { font-size: 13px; font-weight: 550; margin-top: 2px; line-height: 1.35; }
  .chip {
    font-size: 11px; padding: 2px 7px; border-radius: 999px; background: #f2f4f7;
    color: var(--ink-2); white-space: nowrap;
  }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.ok { background: var(--brand-soft); color: var(--brand); }
  .shots { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  .shot {
    position: relative; flex: 0 0 auto; width: 104px; height: 104px; border-radius: 10px;
    border: 2px solid transparent; background: #f2f4f7; cursor: pointer; overflow: hidden;
  }
  .shot img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .shot img.bad { object-fit: contain; padding: 26px; background: #f2f4f7; }
  .shot.orig { background: #f8fafc; }
  .shot.orig img { object-fit: cover; }
  .shot.on { border-color: var(--pick); }
  .shot .tag {
    position: absolute; left: 4px; bottom: 4px; font-size: 10px; padding: 1px 5px;
    border-radius: 5px; background: rgba(16,24,40,.72); color: #fff; letter-spacing: .2px;
  }
  .shot.on .tag { background: var(--pick); }
  .shot .zoom {
    position: absolute; right: 4px; top: 4px; width: 20px; height: 20px; border-radius: 6px;
    background: rgba(255,255,255,.9); color: var(--ink-2); display: none;
    align-items: center; justify-content: center; font-size: 12px;
  }
  .shot:hover .zoom { display: flex; }
  .actions { display: flex; gap: 8px; align-items: center; }
  .actions .ghost { padding: 5px 10px; font-size: 12.5px; }
  .actions .ghost.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .empty { color: var(--ink-3); font-size: 12.5px; padding: 26px 0; text-align: center; border: 1px dashed var(--line); border-radius: 10px; }
  .note { font-size: 12px; color: var(--ink-3); }

  footer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: rgba(255,255,255,.96); border-top: 1px solid var(--line);
    padding: 10px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    backdrop-filter: saturate(180%) blur(10px);
  }
  .progress { flex: 1; min-width: 180px; height: 6px; background: #eef0f3; border-radius: 999px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--brand); width: 0; transition: width .2s; }
  .btn {
    border: none; background: var(--ink); color: #fff; border-radius: 8px;
    padding: 8px 14px; cursor: pointer; font: inherit;
  }
  .btn:hover { opacity: .9; }
  .btn.sec { background: #fff; color: var(--ink-2); border: 1px solid var(--line); }

  #modal {
    position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center;
    background: rgba(16,24,40,.6); padding: 40px;
  }
  #modal.on { display: flex; }
  #modal .box { background: #fff; border-radius: 14px; max-width: 900px; max-height: 88vh; overflow: auto; }
  #modal img { display: block; max-width: 100%; max-height: 66vh; margin: 0 auto; background: #f2f4f7; }
  #modal .meta { padding: 12px 16px; font-size: 12.5px; color: var(--ink-2); border-top: 1px solid var(--line); word-break: break-all; }
  .toast {
    position: fixed; left: 50%; bottom: 74px; transform: translateX(-50%) translateY(10px);
    background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 999px;
    font-size: 13px; opacity: 0; transition: .2s; pointer-events: none; z-index: 70;
  }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 720px) {
    .grid { grid-template-columns: 1fr; }
    .stats { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="title">产品图筛选 <small>只保留产品本体 · 点一张图即选中</small></div>
    <div class="stats">
      <span>待处理 <b id="s-total">–</b></span>
      <span>已选 <b id="s-pick">0</b></span>
      <span>保持原图 <b id="s-keep">0</b></span>
      <span>暂不处理 <b id="s-skip">0</b></span>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="tools">
    <input type="search" id="q" placeholder="搜 SKU / 产品名 / 型号">
    <select id="brand"><option value="">全部品牌</option></select>
    <select id="sort">
      <option value="brand">按品牌</option>
      <option value="cands">候选多的在前</option>
      <option value="unsel">未处理的在前</option>
    </select>
    <span style="flex:1"></span>
    <span class="note" style="margin-right:auto">候选图来自公开检索，可能不是本型号 —— 按外观判断，都不对就点「暂不处理」</span>
    <button class="ghost" id="btn-reset">清空所有选择</button>
  </div>
</header>

<main><div class="grid" id="grid"></div></main>

<footer>
  <div class="progress"><i id="prog"></i></div>
  <span class="note" id="foot-note">–</span>
  <button class="btn sec" id="btn-export">导出选择（JSON）</button>
</footer>

<div id="modal"><div class="box"><img id="m-img" alt=""><div class="meta" id="m-meta"></div></div></div>
<div class="toast" id="toast"></div>

<script>
const KIND_LABEL = { cand: '有候选图', bundle: '套装组合', none: '无净图', material: '辅材' };
let DATA = [], PICKS = {}, filter = 'cand', brand = '', q = '', sort = 'brand', shown = 48;
const NOIMG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#f2f4f7"/>' +
  '<text x="50" y="54" font-size="11" text-anchor="middle" fill="#98a2b3" font-family="sans-serif">无图</text></svg>');
const onerr = `onerror="this.onerror=null;this.src='${NOIMG}';this.classList.add('bad')"`;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1600);
}

async function post(body) {
  const r = await fetch('/api/picks', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
  return r.json();
}

function state(item) {
  const p = PICKS[item.sku];
  if (!p) return null;
  return p.kind;
}

function matches(item) {
  if (brand && item.brand !== brand) return false;
  if (q) {
    const s = (item.sku + ' ' + item.name + ' ' + (item.model || '')).toLowerCase();
    if (!s.includes(q.toLowerCase())) return false;
  }
  const st = state(item);
  if (filter === 'all') return true;
  if (filter === 'cand') return item.cands.length > 0;
  if (filter === 'bundle') return item.kind === 'bundle';
  if (filter === 'none') return item.kind === 'none' || item.kind === 'material';
  if (filter === 'todo') return !st;
  if (filter === 'picked') return st === 'pick';
  if (filter === 'kept') return st === 'original' || st === 'skip';
  return true;
}

function sorted(list) {
  const st = (i) => (state(i) ? 1 : 0);
  if (sort === 'cands') return list.slice().sort((a, b) => b.cands.length - a.cands.length);
  if (sort === 'unsel') return list.slice().sort((a, b) => st(a) - st(b));
  return list.slice().sort((a, b) => (a.brand + a.sku).localeCompare(b.brand + b.sku));
}

function counts() {
  let p = 0, k = 0, s = 0;
  DATA.forEach(i => {
    const st = state(i);
    if (st === 'pick') p++;
    else if (st === 'original') k++;
    else if (st === 'skip') s++;
  });
  $('s-pick').textContent = p; $('s-keep').textContent = k; $('s-skip').textContent = s;
  const done = p + k + s;
  $('prog').style.width = (done / DATA.length * 100).toFixed(1) + '%';
  $('foot-note').textContent = `已处理 ${done} / ${DATA.length}`;
}

function tabs() {
  const defs = [
    ['all', '全部'], ['cand', '有候选图'], ['todo', '未处理'],
    ['bundle', '套装组合'], ['none', '无净图'], ['picked', '已选图'], ['kept', '保持/暂不'],
  ];
  const n = {
    all: DATA.length,
    cand: DATA.filter(i => i.cands.length).length,
    todo: DATA.filter(i => !state(i)).length,
    bundle: DATA.filter(i => i.kind === 'bundle').length,
    none: DATA.filter(i => i.kind === 'none' || i.kind === 'material').length,
    picked: DATA.filter(i => state(i) === 'pick').length,
    kept: DATA.filter(i => ['original','skip'].includes(state(i))).length,
  };
  $('tabs').innerHTML = defs.map(([k, label]) =>
    `<button class="tab ${filter === k ? 'on' : ''}" data-f="${k}">${label}<span class="n">${n[k]}</span></button>`
  ).join('');
  $('tabs').querySelectorAll('.tab').forEach(b =>
    b.onclick = () => { filter = b.dataset.f; shown = 48; tabs(); render(); });
}

function card(item) {
  const st = state(item);
  const cls = ['card'];
  if (st) cls.push('done');
  if (st === 'pick') cls.push('sel');
  const orig = `/public${item.image}`;
  const shots = [];
  shots.push(`<div class="shot orig ${st === 'original' ? 'on' : ''}" data-act="original" title="保持原图">
      <img src="${orig}" loading="lazy" alt="" ${onerr}>
      <span class="tag">原图</span>
      <span class="zoom" data-zoom="${orig}" data-meta="原图 · ${esc(item.sku)}">⤢</span>
    </div>`);
  item.cands.forEach((c, i) => {
    const on = st === 'pick' && PICKS[item.sku].file === c.file;
    shots.push(`<div class="shot ${on ? 'on' : ''}" data-act="pick" data-file="${esc(c.file)}" data-src="${esc(c.src)}" data-page="${esc(c.page)}" title="选这张">
        <img src="${c.file}" loading="lazy" alt="" ${onerr}>
        <span class="tag">${i + 1}</span>
        <span class="zoom" data-zoom="${c.file}" data-meta="${esc(c.src)}">⤢</span>
      </div>`);
  });

  return `<div class="${cls.join(' ')}" data-sku="${esc(item.sku)}">
    <div class="head">
      <div style="flex:1">
        <div class="sku">${esc(item.sku)}${item.model ? ' · ' + esc(item.model) : ''}</div>
        <div class="name">${esc(item.name)}</div>
      </div>
      <span class="chip ${item.cands.length ? 'ok' : (item.kind === 'bundle' ? 'warn' : '')}">${item.cands.length ? item.cands.length + ' 张候选' : (KIND_LABEL[item.kind] || '')}</span>
    </div>
    <div class="shots">${shots.join('')}</div>
    <div class="actions">
      <button class="ghost ${st === 'skip' ? 'on' : ''}" data-act="skip">暂不处理</button>
      <span class="note" style="margin-left:auto">${esc(item.brand)}${item.dtype ? ' · ' + esc(item.dtype) : ''}</span>
    </div>
  </div>`;
}

function render() {
  const list = sorted(DATA.filter(matches));
  const page = list.slice(0, shown);
  let html = page.length ? page.map(card).join('')
    : `<div class="empty">这个筛选条件下没有产品</div>`;
  if (list.length > page.length) {
    html += `<div style="grid-column:1/-1;text-align:center;padding:8px 0 24px">
      <button class="ghost" id="btn-more">还有 ${list.length - page.length} 条，加载更多</button></div>`;
  }
  $('grid').innerHTML = html;
  const more = $('btn-more');
  if (more) more.onclick = () => { shown += 48; render(); };
  counts();
}

async function act(sku, payload) {
  const body = { sku, ...payload };
  const cur = PICKS[sku];
  const same = cur && cur.kind === payload.kind && (payload.kind !== 'pick' || cur.file === payload.file);
  if (same) { delete PICKS[sku]; await post({ sku, clear: true }); }
  else { PICKS[sku] = { ...payload }; await post(body); }
  tabs(); render();
}

$('grid').addEventListener('click', (e) => {
  const z = e.target.closest('[data-zoom]');
  if (z) {
    e.stopPropagation();
    $('m-img').src = z.dataset.zoom;
    $('m-meta').textContent = z.dataset.meta || '';
    $('modal').classList.add('on');
    return;
  }
  const card = e.target.closest('.card');
  if (!card) return;
  const sku = card.dataset.sku;
  const s = e.target.closest('[data-act]');
  if (!s) return;
  const a = s.dataset.act;
  if (a === 'pick') act(sku, { kind: 'pick', file: s.dataset.file, src: s.dataset.src, page: s.dataset.page });
  if (a === 'original') act(sku, { kind: 'original' });
  if (a === 'skip') act(sku, { kind: 'skip' });
});

$('modal').onclick = () => $('modal').classList.remove('on');
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('modal').classList.remove('on'); });

$('q').oninput = (e) => { q = e.target.value.trim(); shown = 48; render(); };
$('brand').onchange = (e) => { brand = e.target.value; shown = 48; render(); };
$('sort').onchange = (e) => { sort = e.target.value; shown = 48; render(); };
$('btn-reset').onclick = async () => {
  if (!confirm('清空所有已选？')) return;
  await post({ reset: true }); PICKS = {}; tabs(); render(); toast('已清空');
};
$('btn-export').onclick = () => {
  const blob = new Blob([JSON.stringify(PICKS, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'picks-ui.json'; a.click();
};

(async () => {
  DATA = await (await fetch('/api/data')).json();
  PICKS = await (await fetch('/api/picks')).json();
  $('s-total').textContent = DATA.length;
  const brands = [...new Set(DATA.map(d => d.brand))].sort();
  $('brand').innerHTML = '<option value="">全部品牌</option>' +
    brands.map(b => `<option value="${esc(b)}">${esc(b)}（${DATA.filter(d => d.brand === b).length}）</option>`).join('');
  tabs(); render();
})();
</script>
</body>
</html>
