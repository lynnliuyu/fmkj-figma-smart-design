name: CI & Domain Knowledge Check

on:
  # 每个分支推送都跑门禁：自动化开发时，分支一推就有反馈，不必等开 PR。
  push:
    branches: ['**']
  pull_request:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # 与 Dockerfile 的 builder 阶段一致的构建期占位环境变量。
    # 只做编译/自检，不连数据库（占位 DATABASE_URI 不会真正建连到任何实例）。
    env:
      PAYLOAD_CONFIG_PATH: src/payload.selfhost.config.ts
      PAYLOAD_SECRET: ci-build-placeholder-not-for-runtime
      DATABASE_URI: postgres://fmkj:build-only@127.0.0.1:5432/fmkj
      PUBLIC_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # CI 里没有 Figma Make 环境（FIGMA_EID），默认的 src/payload.config.ts
      # （buildFigmaConfig）会让任何 payload 命令直接抛 "Environment ID could not be resolved"。
      # 按 Dockerfile 的做法把 @payload-config 指向自托管配置，只在 runner 内改写，不提交。
      - name: 切换到自托管构建配置
        run: printf "export { default } from './payload.selfhost.config'\n" > src/payload.config.ts

      - name: 代码格式检查
        run: pnpm exec oxfmt --check

      # ESLint 只开「能抓到真 bug」的规则（React Hooks + Next img），不做风格检查。
      # 当前基线 0 error 0 warning，所以把阈值收到 0 —— 任何新警告都会让 CI 红，
      # 避免警告越积越多最后没人看。
      - name: ESLint 语义检查
        run: pnpm exec eslint . --max-warnings 0

      - name: TypeScript 类型检查
        run: pnpm exec tsc --noEmit

      - name: 领域知识库与规则回归测试
        run: pnpm run knowledge:check

      - name: 单元测试
        run: pnpm test

      # 生产构建门禁：复刻 Dockerfile builder（generate:importmap + payload build）。
      - name: 生产构建
        run: |
          pnpm exec payload generate:importmap
          pnpm build

  # ── 页面冒烟测试 ─────────────────────────────────────────────────────
  # 前面六道门禁全都只看代码，看不到页面：类型过了、单测过了、构建过了，
  # 页面照样可能把内部枚举名印到客户合同上，或者整页卡在骨架屏。
  # 这个 job 起真实 PostgreSQL + 真服务 + 真浏览器，断言用户能感知的东西。
  smoke:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fmkj
          POSTGRES_PASSWORD: fmkj
          POSTGRES_DB: fmkj
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PAYLOAD_CONFIG_PATH: src/payload.selfhost.config.ts
      PAYLOAD_SECRET: ci-smoke-placeholder-not-for-runtime
      DATABASE_URI: postgres://fmkj:fmkj@127.0.0.1:5432/fmkj
      PUBLIC_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
      SMOKE_BASE: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 切换到自托管构建配置
        run: printf "export { default } from './payload.selfhost.config'\n" > src/payload.config.ts

      - name: 跑数据库迁移
        run: pnpm exec payload migrate

      - name: 造种子数据（账号 + 示例项目）
        id: seed
        run: |
          pnpm exec payload run --input '{"scriptPath":"scripts/seed-smoke.ts"}' | tee /tmp/seed.log
          echo "project_id=$(grep -oE 'SMOKE_PROJECT_ID=\S+' /tmp/seed.log | tail -1 | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: 装 Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: 启动服务并等待就绪
        run: |
          pnpm exec next dev --port 3000 --hostname 127.0.0.1 > /tmp/dev.log 2>&1 &
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:3000/login || true)
            if [ "$code" = "200" ]; then echo "服务就绪（${i} 次探测）"; exit 0; fi
            sleep 3
          done
          echo "服务 120 秒内未就绪，dev 日志："
          tail -40 /tmp/dev.log
          exit 1

      # verify job 里的「生产构建」用的是占位 DATABASE_URI（连不上库），
      # 那样只验证了「编译能过」，验证不了「页面在构建期取数据时会不会卡住」。
      # 这里在**真库**上再构建一次：任何页面在构建期取不到数据、或触发交互式提示
      # （Payload 的 push 模式残留会这样），都会在这里暴露。
      - name: 在真库上跑生产构建
        run: |
          printf "export { default } from './payload.selfhost.config'\n" > src/payload.config.ts
          pnpm exec payload generate:importmap
          pnpm build

      - name: 页面冒烟测试
        env:
          SMOKE_PROJECT_ID: ${{ steps.seed.outputs.project_id }}
        run: node e2e/smoke.mjs

      - name: 失败时上传证据
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: |
            /tmp/fmkj-smoke
            /tmp/dev.log
          retention-days: 7
