name: Image

# 在 GitHub 上构建设备版镜像（本机 Docker 只有 5.8G 内存，构建会把它拖崩）。
# 设备是 aarch64，所以只出 linux/arm64；构建用 QEMU 模拟，慢但不用本机资源。
#
# 触发方式：
#   1) 推标签：git push origin v0.3.15
#   2) 页面手动跑：Actions → Image → Run workflow，填版本号
#
# 构建产物推到 GitHub 自己的镜像仓库（ghcr.io）。这个仓库是私有的，
# 设备/本机要用得先 docker login ghcr.io（一次性）。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（要以 v 开头，例如 v0.3.15）
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fmkj-v3
  NPM_REGISTRY: https://registry.npmmirror.com

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本号
        id: meta
        run: |
          VERSION="${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          case "$VERSION" in
            v*) ;;
            *) echo "::error::版本号要以 v 开头，例如 v0.3.15"; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "  构建版本：$VERSION"

      # 用和 CI 完全相同的环境与命令：构建前先确认这批代码是绿的。
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 测试
        run: pnpm test

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub 镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送（linux/arm64）
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          build-args: |
            NPM_REGISTRY=${{ env.NPM_REGISTRY }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 结果摘要
        run: |
          {
            echo "### 镜像已构建并推送"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | \`${{ steps.meta.outputs.version }}\` |"
            echo "| 地址 | \`${{ env.IMAGE }}:${{ steps.meta.outputs.version }}\` |"
            echo "| 平台 | linux/arm64（设备是 aarch64） |"
            echo "| 提交 | \`${{ github.sha }}\` |"
            echo "| 摘要 | \`${{ steps.build.outputs.digest }}\` |"
            echo ""
            echo "把它搬到本机仓库（设备从这里升级）："
            echo ""
            echo '```bash'
            echo "bash scripts/deploy/sync-image-from-ghcr.sh --version ${{ steps.meta.outputs.version }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
