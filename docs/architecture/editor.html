<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>繁梦空间设计站 · 流程图编辑器</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:#f5f5f5;color:#2d3142;font:14px/1.5 'PingFang SC','Microsoft YaHei',system-ui,sans-serif}header{padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #d3d5dc}h1{font-size:17px;line-height:1.4;margin:0;font-weight:600}nav{margin-left:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}a{color:#2e5aa8;text-underline-offset:3px}a:hover{color:#173a79}a:focus-visible,button:focus-visible{outline:2px solid #2e5aa8;outline-offset:4px}button{font:inherit;padding:6px 12px;border:1px solid #2e5aa8;border-radius:4px;background:#2e5aa8;color:white;cursor:pointer}button:hover{background:#173a79}button:disabled{background:#d3d5dc;color:#4f5d75;border-color:#d3d5dc;cursor:wait}#status{margin:0;color:#4f5d75;font-size:12px}#status[data-error="true"]{color:#9c261b}.hint{margin:0;padding:8px 20px;font-size:12px;color:#4f5d75;border-bottom:1px solid #d3d5dc}iframe{display:block;width:100%;flex:1;border:0;min-height:360px;background:white}::selection{background:#dbe5f6;color:#2d3142}@media(max-width:760px){header{padding:10px 12px;gap:6px 12px}h1{font-size:15px}nav{font-size:12px}.hint{padding:8px 12px}#status{width:100%}}
</style>
</head>
<body>
<header><h1 id="title">流程图编辑</h1><nav aria-label="文档操作"><a href="/" id="back">项目列表</a><a id="download" href="#" download>下载副本</a><button id="save" disabled>保存到项目</button></nav><p id="status" role="status" aria-live="polite">正在加载本机编辑器…</p></header>
<p class="hint">底部切换分图 · 双击改文字 · 拖动改位置 · 拖动连接箭头改关系 · <b>Alt+滚轮缩放</b> · <b>Alt+左键拖动画布</b> · 保存到项目后可刷新再打开。虚线框为规划；改图后仍需 Agent 核对代码。</p>
<iframe id="editor" title="中文 draw.io 架构编辑画布" referrerpolicy="no-referrer"></iframe>
<script>
const frame=document.getElementById('editor'), status=document.getElementById('status'), saveButton=document.getElementById('save');
const token='__EDITOR_TOKEN__';
// 项目名由服务端写入模板（容器里一份页面服务多个项目）；写全局变量避免转义问题。
const project=window.__PROJECT__||new URLSearchParams(location.search).get('project')||'';
const headers={'X-Editor-Token':token};
// 未启用令牌 = 只读：能看图、下载副本，保存与新建会被服务拒绝。
const writable=Boolean(token);
let revision='', dirty=false, busy=false, serial=0, downloadRequested=false;
// draw.io 切换分图、缩放都会触发变化事件，并把视口偏移 dx/dy 写进模型；这些都不算编辑。
// 只比较去掉 dx/dy 后的内容，避免出现“只切了页签却提示未保存”的假象。
let lastSaved=null, currentXml=null;
// 基线要用 draw.io 自己输出的 XML：它重排属性、省略声明，与服务端文件形式不同。
let baselinePending=false;
// draw.io 回传的 XML 会重排属性顺序（value/parent/style、mxGeometry 的 height width x y），
// 并省略文件里的 XML 声明，所以不能直接比字符串。这里解析成 DOM，按属性名排序后
// 重新序列化再比较；同时忽略只表示视口位置的 dx/dy。只有真正的内容差异才算修改。
const normalize=xml=>{
 const doc=new DOMParser().parseFromString(String(xml==null?'':xml),'application/xml');
 if(doc.querySelector('parsererror'))return String(xml==null?'':xml);
 const walk=node=>{
  if(node.nodeType===3)return node.nodeValue.trim()?node.nodeValue.trim():'';
  if(node.nodeType!==1)return '';
  node.removeAttribute('dx');node.removeAttribute('dy');
  const attrs=[...node.attributes].map(a=>a.name+'="'+a.value+'"').sort().join(' ');
  const kids=[...node.childNodes].map(walk).filter(Boolean).join('');
  return '<'+node.nodeName+(attrs?' '+attrs:'')+'>'+kids+'</'+node.nodeName+'>';
 };
 return walk(doc.documentElement);
};
const contentChanged=()=>lastSaved==null||currentXml==null||normalize(currentXml)!==lastSaved;
function say(message,error=false){status.textContent=message;status.dataset.error=String(error)}
function send(data){frame.contentWindow.postMessage(JSON.stringify(data),location.origin)}
if(!project){say('缺少项目名，请从项目列表进入。',true);saveButton.textContent='未选择项目'}
else{const heading=document.getElementById('title');if(heading)heading.textContent=project+' · 流程图编辑';document.title=project+' · 流程图编辑'}
if(!writable)saveButton.textContent='只读模式';
const api='/api/diagram?project='+encodeURIComponent(project);
// 读取失败时优先显示服务器给的原因（例如“编辑凭证已过期”），拿不到再退回通用文字。
async function readError(response,fallback){
 try{const payload=await response.json();if(payload&&payload.error)return payload.error}catch{}
 return fallback+'（HTTP '+response.status+'）';
}
const diagram=project?fetch(api,{headers}).then(async r=>{if(!r.ok)throw Error(await readError(r,'架构文件读取失败'));return r.json()}).then(d=>{revision=d.revision;currentXml=d.xml;lastSaved=normalize(d.xml);return d.xml}):Promise.reject(Error('缺少项目名'));
diagram.catch(e=>say(e.message+'。可回到项目列表重新进入以取得编辑权限；本机部署仍可只读查看与下载。',true));
window.addEventListener('message',async event=>{
 if(event.origin!==location.origin||event.source!==frame.contentWindow)return;
 let data;try{data=JSON.parse(event.data)}catch{return}
 if(data.event==='init'){
  try{send({action:'load',xml:await diagram,title:project+' · 项目流程图',autosave:1,saveAndExit:0});say(writable?'已加载项目文件。修改后点击“保存”。':'已加载项目文件（只读：未启用编辑令牌，可修改并下载副本，不能保存到项目）。')}catch(e){say(e.message,true)}
 }else if(data.event==='load'){
  send({action:'fit',maxScale:1,border:24});saveButton.disabled=false;baselinePending=true;send({action:'invokeAction',actionName:'save'});
 }else if(data.event==='autosave'){
  if(typeof data.xml==='string')currentXml=data.xml;
  serial++;dirty=contentChanged();
  say(dirty?'有未保存的修改。点击“保存”写入项目。':'内容未变化（切换分图、缩放或平移不计为修改）。');
 }else if(data.event==='save'){
  if(baselinePending){
   baselinePending=false;currentXml=data.xml;lastSaved=normalize(data.xml);dirty=false;
   say(writable?'已加载项目文件。修改后点击“保存”。':'已加载项目文件（只读模式）。');return;
  }
  if(downloadRequested){
   downloadRequested=false;downloadXml(data.xml);
   send({action:'status',message:dirty?'副本已下载，项目仍有未保存修改':'副本已下载',modified:dirty});return;
  }
  dirty=contentChanged();
  if(!writable){say('只读模式：未启用编辑令牌，无法保存到项目；请用“下载副本”保留修改。',true);send({action:'status',message:'只读模式，未保存',modified:true});return}
  if(busy){say('上一笔正在保存，请稍后再保存当前修改。');return}
  busy=true;saveButton.disabled=true;const savedSerial=serial;say('正在保存到项目…');
  try{
   const response=await fetch(api,{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({project,xml:data.xml,revision})});
   const result=await response.json().catch(()=>({}));
   if(!response.ok)throw Error(result.error||('保存失败（HTTP '+response.status+'）'));
   revision=result.revision;currentXml=data.xml;lastSaved=normalize(data.xml);
   dirty=contentChanged()||serial!==savedSerial;
   say(dirty?'已保存提交时的内容，仍有新修改待保存。':'已保存到项目 · '+result.savedAt+' · 已保留上一版备份');
   send({action:'status',message:dirty?'有新修改待保存':'已保存到项目',modified:dirty});
  }catch(e){
   // 网络层失败（浏览器只给一句 Failed to fetch）最常见的原因是编辑凭证过期，直接说清怎么办。
   const hint=e instanceof TypeError
     ? '保存失败：编辑凭证可能已过期（编辑器重启过或页面开得太久）。请回到项目列表重新点「编辑」进入；当前修改先点「下载副本」保留。'
     : e.message;
   say(hint,true);send({action:'status',message:'保存失败，内容仍在编辑器',modified:true});
  }
  finally{busy=false;saveButton.disabled=false}
 }
});
saveButton.addEventListener('click',()=>send({action:'invokeAction',actionName:'save'}));
document.getElementById('download').addEventListener('click',event=>{
 event.preventDefault();if(saveButton.disabled)return;
 downloadRequested=true;send({action:'invokeAction',actionName:'save'});
});
function downloadXml(xml){
 const url=URL.createObjectURL(new Blob([xml],{type:'application/xml'}));
 const a=document.createElement('a');a.href=url;a.download=(project||'架构')+'-流程图副本.drawio';a.click();URL.revokeObjectURL(url);
}
// 手势约定（都用 Alt 做导航键）：
//   Alt+滚轮     → 缩放。draw.io 原生把 Ctrl+滚轮当缩放、Alt+滚轮当滚动，
//                  这里拦下 Alt+滚轮再补发一个“带 ctrlKey 的滚轮”，走它原生的缩放逻辑，
//                  好处是缩放中心跟着光标、和 Ctrl+滚轮完全一致。Ctrl/⌘+滚轮原生也可用。
//   Alt+左键拖动 → 平移画布。draw.io 原生用 Ctrl+左键平移；这里拦下 Alt+左键按下，
//                  再补发一个“带 ctrlKey 的同类按下事件”，交给它自己的平移逻辑；
//                  后续真实的移动/松开事件照常穿透，所以拖动是连续的。
// 代价：Alt 在 draw.io 里原本还兼作“拖动不吸附网格”“Alt+点击选中下层图形”，
//       被平移接管后这两项不再生效。
frame.addEventListener('load',()=>{
  let win;try{win=frame.contentWindow}catch{return}
  // Alt+滚轮 = 缩放（补发成 Ctrl+滚轮）
  win.addEventListener('wheel',event=>{
    if(!event.altKey)return;
    event.preventDefault();event.stopPropagation();
    try{
      const target=event.target;
      if(target&&typeof target.dispatchEvent==='function'){
        target.dispatchEvent(new win.WheelEvent('wheel',{
          bubbles:true,cancelable:true,view:win,
          clientX:event.clientX,clientY:event.clientY,
          screenX:event.screenX,screenY:event.screenY,
          deltaX:event.deltaX,deltaY:event.deltaY,deltaZ:event.deltaZ,deltaMode:event.deltaMode,
          ctrlKey:true,altKey:false,shiftKey:false,metaKey:false,
        }));
      }
    }catch{/* 补发失败就退化为无操作，不影响正常编辑 */}
  },{capture:true,passive:false});
  // Alt+左键拖动 = 平移画布（补发成 Ctrl+左键按下）
  win.addEventListener('mousedown',event=>{
    if(!event.altKey||event.button!==0)return;
    event.preventDefault();event.stopPropagation();
    try{
      const target=event.target;
      if(target&&typeof target.dispatchEvent==='function'){
        target.dispatchEvent(new win.MouseEvent('mousedown',{
          bubbles:true,cancelable:true,view:win,
          clientX:event.clientX,clientY:event.clientY,
          screenX:event.screenX,screenY:event.screenY,
          button:0,buttons:1,detail:1,
          ctrlKey:true,altKey:false,shiftKey:false,metaKey:false,
        }));
      }
    }catch{/* 补发失败就退化为无操作，不影响正常编辑 */}
  },{capture:true});
},{once:true});
window.addEventListener('beforeunload',e=>{if(dirty||busy){e.preventDefault();e.returnValue=''}});
frame.src='/drawio/index.html?embed=1&proto=json&lang=zh&offline=1&local=1&ui=kennedy&saveAndExit=0&noExitBtn=1&libraries=1&dark=0';
</script>
</body></html>
